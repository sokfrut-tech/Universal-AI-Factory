# Jarvis Ai RU Pilot SFT (Qwen2.5-0.5B-Instruct LoRA — RTX 4050 6 GB VRAM)
base: Qwen/Qwen2.5-0.5B-Instruct
task: sft
backend: transformers

data:
  train: training/soup/data/jarvis_ru_starter.jsonl
  format: alpaca
  val_split: 0.1
  max_length: 768

training:
  epochs: 3
  lr: 2e-4
  batch_size: 2
  gradient_accumulation_steps: 4
  quantization: none
  scheduler: cosine
  warmup_ratio: 0.05
  logging_steps: 2
  save_steps: 50
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: auto

output: C:/Users/user/Desktop/codex/soup_runs/jarvis_ru_05b_pilot
