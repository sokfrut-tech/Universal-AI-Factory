# Jarvis Ai RAFT (Retrieval-Augmented Fine-Tuning for local Android DocumentStore RAG)
base: Qwen/Qwen2.5-3B-Instruct
task: sft
backend: transformers

data:
  train: training/soup/data/jarvis_ru_raft.jsonl
  format: raft
  val_split: 0.1
  max_length: 512
  raft_epoch_shuffle: true

training:
  epochs: 3
  lr: 1.5e-4
  batch_size: 1
  gradient_accumulation_steps: 4
  quantization: 4bit
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: auto

output: C:/Users/user/Desktop/codex/soup_runs/jarvis_ru_rag_raft
