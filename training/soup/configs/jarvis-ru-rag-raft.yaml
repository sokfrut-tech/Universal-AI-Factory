# Jarvis Ai RAFT (Retrieval-Augmented Fine-Tuning for local Android DocumentStore RAG)
base: Qwen/Qwen2.5-3B-Instruct
task: sft
backend: transformers

data:
  train: training/soup/data/jarvis_ru_raft.jsonl
  format: raft
  val_split: 0.1
  max_length: 1024
  raft_epoch_shuffle: true

training:
  epochs: 3
  lr: 1.5e-4
  batch_size: 1
  gradient_accumulation_steps: 4
  quantization: 4bit
  logging_steps: 5
  save_steps: 50
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: auto

output: ./output_jarvis_rag_raft
