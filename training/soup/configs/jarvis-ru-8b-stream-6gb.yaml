# Jarvis Ai 8B Layer Streaming (for 4-6 GB VRAM laptop GPUs + 16 GB RAM)
base: meta-llama/Llama-3.1-8B-Instruct
task: sft
backend: transformers

data:
  train: training/soup/data/jarvis_ru_starter.jsonl
  format: alpaca
  val_split: 0.1
  max_length: 512

training:
  epochs: 2
  lr: 1.5e-4
  batch_size: 1
  gradient_accumulation_steps: 8
  quantization: 4bit
  stream_layers: true
  stream_source: auto
  stream_buffers: 2
  logging_steps: 5
  save_steps: 50
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: auto

output: ./output_jarvis_8b_stream
