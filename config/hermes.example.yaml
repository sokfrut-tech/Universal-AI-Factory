# Пример конфигурации ядра фабрик (Hermes Agent).
# Скопируйте в локальный файл, например config/hermes.local.yaml, и заполните у себя.
# Ключи в этот файл не записываются: используйте переменные окружения.
# Файл hermes.local.yaml добавьте в .gitignore и не коммитьте.
# ВНИМАНИЕ: блоки gateway и permissions — предложение фабрик, их имена не сверены
# со схемой Hermes. Перед запуском сверьте с cli-config.yaml.example в репозитории Hermes.

model:
  # Основная модель. Выберите одну из вариантов ниже и раскомментируйте.
  provider: "anthropic"          # нужен ANTHROPIC_API_KEY
  default: "claude-sonnet-4-5"   # укажите актуальное имя модели из документации провайдера

  # provider: "openai"           # нужен OPENAI_API_KEY
  # default: "gpt-4.1"

  # provider: "gemini"           # нужен GOOGLE_API_KEY или GEMINI_API_KEY
  # default: "gemini-2.5-pro"

  # Бесплатный локальный вариант (Ollama):
  # provider: "custom"
  # base_url: "http://127.0.0.1:11434/v1"
  # default: "qwen2.5:14b"       # модель, которую вы скачали локально

# Каналы: используйте отдельный тестовый бот, не бот для клиентов.
gateway:
  # Токен бота задаётся переменной окружения TELEGRAM_BOT_TOKEN.
  # Не указывайте токен в этом файле.
  telegram:
    enabled: false               # включить после проверки

# Права агента: только рабочие папки и ветки, без записи в main.
permissions:
  write_branches_only: true
  forbid_push_to_main: true
  require_owner_approval_for:
    - merge
    - deploy
    - client_messages
