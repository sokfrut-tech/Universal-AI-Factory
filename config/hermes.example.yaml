# Safe starter configuration for Hermes Agent.
# Copy locally to ~/.hermes/config.yaml. Never store API keys or tokens here.

model:
  provider: "anthropic"
  default: "claude-sonnet-4-5"

# Valid top-level gateway lifecycle section.
gateway:
  trust_env: false
  platforms:
    telegram:
      extra:
        drop_pending_on_cold_boot: true

# Restrict the Telegram test bot to file and planning tools only.
platform_toolsets:
  cli: [hermes-cli]
  telegram: [file, todo]

# Hermes has no top-level "permissions" section.
security:
  approval:
    transport: builtin
    transport_fallback: deny
  protected_instruction_files: true

# Set locally in ~/.hermes/.env using hermes gateway setup:
# TELEGRAM_BOT_TOKEN=<enter locally; never commit>
# TELEGRAM_ALLOWED_USERS=<owner numeric Telegram ID>
# Use a separate BotFather test bot, never the customer-facing bot.
# Start only when explicitly requested: hermes gateway
