name: UPKB validation

on:
  push:
    branches: [main, "feature/upkb-knowledge-base-bootstrap"]
    paths: ["UPKB/**"]
  pull_request:
    paths: ["UPKB/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.22,<5"
      - name: Validate UPKB indexes and schemas
        run: python UPKB/tools/validate_upkb.py
      - name: Run negative and positive schema contract tests
        run: python -m unittest discover -s UPKB/tests -p "test_*.py" -v
