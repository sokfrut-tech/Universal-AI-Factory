name: UPKB validation

on:
  push:
    branches: [main, "feature/upkb-knowledge-base-bootstrap"]
    paths: ["UPKB/**"]
  pull_request:
    paths: ["UPKB/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate UPKB indexes and schemas
        run: python UPKB/tools/validate_upkb.py
