name: Universal AI Factory Read-only Audit

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Выбери разрешённый репозиторий"
        required: true
        type: choice
        options:
          - avtoy-korea-auto
          - RussSearchOPPO
          - Antigravity-Mobile
          - happ-proxy-pool
      task_file:
        description: "Необязательно: точный путь к задаче в coordination/claude/inbox/ или coordination/gemini/inbox/"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: factory-audit-${{ github.workflow }}-${{ inputs.target_repo }}
  cancel-in-progress: false

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          path: factory
          persist-credentials: false
          fetch-depth: 1

      - name: Test runner security boundaries
        run: python factory/scripts/test_factory_runner_security.py

      - name: Validate dispatch inputs
        id: validate
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TASK_FILE: ${{ inputs.task_file }}
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_REPO" in
            avtoy-korea-auto|RussSearchOPPO|Antigravity-Mobile|happ-proxy-pool) ;;
            *) echo "::error::Target repository is not allowlisted"; exit 1 ;;
          esac
          if [[ -n "$TASK_FILE" ]]; then
            if [[ ! "$TASK_FILE" =~ ^coordination/(claude|gemini)/inbox/[A-Za-z0-9._-]+\.md$ ]]; then
              echo "::error::Task must be a Markdown file directly inside the Claude/Gemini inbox"
              exit 1
            fi
            if [[ ! -f "factory/$TASK_FILE" ]]; then
              echo "::error::The explicitly selected inbox task does not exist"
              exit 1
            fi
          fi
          printf 'target_repo=%s\n' "$TARGET_REPO" >> "$GITHUB_OUTPUT"
          printf 'task_file=%s\n' "$TASK_FILE" >> "$GITHUB_OUTPUT"

      - name: Checkout allowlisted target (read-only)
        uses: actions/checkout@v4
        with:
          repository: sokfrut-tech/${{ steps.validate.outputs.target_repo }}
          token: ${{ github.token }}
          path: target_repo
          persist-credentials: false
          fetch-depth: 1

      - name: Produce factual audit report
        env:
          TARGET_REPO: ${{ steps.validate.outputs.target_repo }}
          TASK_FILE: ${{ steps.validate.outputs.task_file }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p factory-report
          REPORT="factory-report/FACTORY_STATUS.md"
          {
            echo "# Universal AI Factory — read-only audit"
            echo
            echo "- Result: **inventory_only**"
            echo "- Target: `sokfrut-tech/$TARGET_REPO`"
            echo "- Commit: `$(git -C target_repo rev-parse HEAD)`"
            echo "- Timestamp: `$(date -u '+%Y-%m-%d %H:%M:%S UTC')`"
            echo "- Task file: ${TASK_FILE:-"(not selected; no task auto-discovery)"}"
            echo
            echo "## Repository inventory"
            echo "- Tracked files: $(git -C target_repo ls-files | wc -l | tr -d ' ')"
            echo "- Branch refs visible in checkout: $(git -C target_repo branch -r | wc -l | tr -d ' ')"
            echo
            echo "## Scope and limitations"
            echo "- This workflow performs read-only repository inventory only."
            echo "- It does not invoke Claude/Gemini or claim task execution."
            echo "- It does not run project tests, dependency scans, deployment checks, or runtime verification."
            echo "- No repository files are modified and no commit is pushed."
            echo "- A task selection is metadata only; it is not dispatched."
          } > "$REPORT"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: factory-audit-${{ inputs.target_repo }}-${{ github.run_id }}
          path: factory-report/FACTORY_STATUS.md
          if-no-files-found: error
          retention-days: 14
