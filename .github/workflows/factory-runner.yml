name: Universal AI Factory Audit (Hardened)

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: Approved target repository
        required: true
        type: choice
        options:
          - sokfrut-tech/Antigravity-Mobile
          - sokfrut-tech/Gemeni
          - sokfrut-tech/RussSearchOPPO
          - sokfrut-tech/avtoy-korea-auto
          - sokfrut-tech/Universal-AI-Factory
      task_file:
        description: Explicit inbox task path (coordination/<agent>/inbox/<file>.md)
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout factory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: factory
          persist-credentials: false

      - name: Validate explicit inputs and hash task metadata
        id: validate
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          TASK_FILE: ${{ inputs.task_file }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          target = os.environ["TARGET_REPO"]
          allowed = {
              "sokfrut-tech/Antigravity-Mobile",
              "sokfrut-tech/Gemeni",
              "sokfrut-tech/RussSearchOPPO",
              "sokfrut-tech/avtoy-korea-auto",
              "sokfrut-tech/Universal-AI-Factory",
          }
          if target not in allowed:
              raise SystemExit("target repository is not allowlisted")
          raw = os.environ["TASK_FILE"]
          if not raw or "\x00" in raw or "\\" in raw or raw.startswith("/"):
              raise SystemExit("invalid task path")
          rel = pathlib.PurePosixPath(raw)
          if any(part in ("", ".", "..") for part in rel.parts):
              raise SystemExit("task path is not normalized")
          if len(rel.parts) != 4 or rel.parts[0] != "coordination" or rel.parts[2] != "inbox" or rel.parts[1] not in {"claude", "gemini", "gpt"} or rel.suffix != ".md":
              raise SystemExit("task must be a Markdown file directly inside an approved agent inbox")
          root = pathlib.Path("factory").resolve()
          task = (root / pathlib.Path(*rel.parts)).resolve(strict=True)
          if root not in task.parents or not task.is_file() or task.is_symlink():
              raise SystemExit("task path is not a regular file within factory checkout")
          data = task.read_bytes()
          if not data or len(data) > 256_000:
              raise SystemExit("task file is empty or exceeds 256 KB")
          digest = hashlib.sha256(data).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"target_repo={target}\n")
              out.write(f"task_path={raw}\n")
              out.write(f"task_bytes={len(data)}\n")
              out.write(f"task_sha256={digest}\n")
          PY

      - name: Checkout approved public target (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.validate.outputs.target_repo }}
          path: target_repo
          fetch-depth: 1
          persist-credentials: false

      - name: Create metadata-only audit report
        env:
          TARGET_REPO: ${{ steps.validate.outputs.target_repo }}
          TASK_PATH: ${{ steps.validate.outputs.task_path }}
          TASK_BYTES: ${{ steps.validate.outputs.task_bytes }}
          TASK_SHA256: ${{ steps.validate.outputs.task_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p audit-output
          {
            echo "# Universal AI Factory — read-only audit"
            echo
            echo "- Target repository: `$TARGET_REPO`"
            echo "- Target commit: `$(git -C target_repo rev-parse HEAD)`"
            echo "- Task file: `$TASK_PATH`"
            echo "- Task size: `$TASK_BYTES` bytes"
            echo "- Task SHA-256: `$TASK_SHA256`"
            echo "- Mode: metadata-only; task contents are not copied to logs or report"
            echo "- Permissions: contents: read; no PAT or write token"
            echo "- Execution: no patch application, project commands, PR creation, merge or deployment"
          } > audit-output/FACTORY_AUDIT.md

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: factory-audit-report
          path: audit-output/FACTORY_AUDIT.md
          if-no-files-found: error
          retention-days: 14
