name: Universal AI Factory Runner

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Целевой репозиторий (например: avtoy-korea-auto)'
        required: true
        default: 'avtoy-korea-auto'
      task_file:
        description: 'Путь к файлу ТЗ от Claude (или оставь пустым для автопоиска последнего .md)'
        required: false
        default: ''
      action_mode:
        description: 'Режим работы'
        required: true
        type: choice
        options:
          - audit_and_report
          - merge_pr_43_and_verify
          - sync_task_to_target
  push:
    branches: [ main ]
    paths:
      - 'tasks/**'
      - 'specs/**'
      - '*.md'

permissions:
  contents: write

jobs:
  run-factory:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Universal-AI-Factory
        uses: actions/checkout@v4
        with:
          path: factory
          fetch-depth: 0

      - name: 2. Поиск и чтение задания от Claude
        id: find_task
        run: |
          cd factory
          if [ -n "${{ github.event.inputs.task_file }}" ] && [ -f "${{ github.event.inputs.task_file }}" ]; then
            TASK_FILE="${{ github.event.inputs.task_file }}"
          else
            # Ищем самый свежий .md файл (кроме README.md и старых отчетов)
            TASK_FILE=$(find . -maxdepth 3 -name "*.md" ! -name "README.md" ! -name "FACTORY_STATUS.md" -printf "%T@ %p\n" | sort -n | tail -1 | cut -d' ' -f2-)
          fi
          echo "Найдено задание: $TASK_FILE"
          echo "task_file=$TASK_FILE" >> $GITHUB_OUTPUT

      - name: 3. Checkout целевого репозитория
        uses: actions/checkout@v4
        with:
          repository: sokfrut-tech/${{ github.event.inputs.target_repo || 'avtoy-korea-auto' }}
          token: ${{ secrets.FACTORY_PAT || github.token }}
          path: target_repo
          fetch-depth: 0

      - name: 4. Проверка ТЗ, веток и PR в целевом репозитории
        id: audit
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT || github.token }}
        run: |
          REPORT="factory/FACTORY_STATUS.md"
          TARGET="${{ github.event.inputs.target_repo || 'avtoy-korea-auto' }}"
          TASK="${{ steps.find_task.outputs.task_file }}"

          echo "# 🏭 Отчет Universal-AI-Factory" > $REPORT
          echo "**Дата запуска:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $REPORT
          echo "**Целевой репозиторий:** \`sokfrut-tech/$TARGET\`" >> $REPORT
          echo "**Проверенный файл задания:** \`$TASK\`" >> $REPORT
          echo "" >> $REPORT

          if [ -n "$TASK" ] && [ -f "factory/$TASK" ]; then
            echo "## 📋 Содержимое актуального задания Claude" >> $REPORT
            echo '```markdown' >> $REPORT
            cat "factory/$TASK" >> $REPORT
            echo '```' >> $REPORT
          fi

          cd target_repo
          echo "## 🌿 Активные ветки в $TARGET" >> ../$REPORT
          echo '```text' >> ../$REPORT
          git branch -r >> ../$REPORT
          echo '```' >> ../$REPORT

          echo "## 🔍 Проверка критических компонентов (avtoy-korea-auto)" >> ../$REPORT
          if [ -f "worker.js" ]; then
            TG_COUNT=$(grep -c -i "telegram" worker.js || true)
            SPORTAGE_COUNT=$(grep -c -i "sportage" worker.js || true)
            LOGO_COUNT=$(grep -c -i "logo" worker.js || true)
            echo "- Упоминаний логики Telegram в \`worker.js\`: **$TG_COUNT** (целостность сохранена)" >> ../$REPORT
            echo "- Ссылок на Sportage: **$SPORTAGE_COUNT**" >> ../$REPORT
            echo "- Ссылок на Logo: **$LOGO_COUNT**" >> ../$REPORT
          fi

          if [ -f "wrangler.toml" ]; then
            echo "- Конфигурация \`wrangler.toml\`:" >> ../$REPORT
            echo '```toml' >> ../$REPORT
            cat wrangler.toml >> ../$REPORT
            echo '```' >> ../$REPORT
          fi

      - name: 5. Сохранение полного дампа отчета в фабрику
        run: |
          cd factory
          git config user.name "Universal-AI-Factory Bot"
          git config user.email "factory-bot@users.noreply.github.com"
          git add FACTORY_STATUS.md
          git diff --staged --quiet || (git commit -m "chore(factory): auto-audit report [skip ci]" && git push)
