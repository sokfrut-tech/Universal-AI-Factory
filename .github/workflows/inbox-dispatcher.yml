name: Multi-Agent Inbox Dispatcher

on:
  push:
    branches: [ main ]
    paths:
      - 'coordination/claude/inbox/*.md'
      - 'coordination/gemini/inbox/*.md'
      - 'coordination/chatgpt/inbox/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-agent-inbox-dispatcher
  cancel-in-progress: false

jobs:
  process-inboxes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Universal-AI-Factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create non-authoritative receipt for each new inbox message
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "Manual run: no inbox message was supplied; no receipt created."
            exit 0
          fi

          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${SHA}~1 ${SHA}"
          else
            RANGE="${BEFORE} ${SHA}"
          fi

          mkdir -p coordination/claude/outbox coordination/gemini/outbox coordination/chatgpt/outbox
          FOUND=0
          for AGENT in claude gemini chatgpt; do
            INBOX="coordination/${AGENT}/inbox"
            OUTBOX="coordination/${AGENT}/outbox"
            # shellcheck disable=SC2086
            while IFS= read -r TASK_PATH; do
              [ -n "${TASK_PATH}" ] || continue
              FOUND=1
              TASK_NAME="$(basename "${TASK_PATH}")"
              OUT_FILE="${OUTBOX}/ACK_${TASK_NAME}"
              if [ -f "${OUT_FILE}" ]; then
                echo "Receipt already exists: ${OUT_FILE}"
                continue
              fi
              {
                echo "# Автоматическая квитанция фабрики"
                echo
                echo "- Исходное сообщение: \`${TASK_PATH}\`"
                echo "- Адресат: ${AGENT}"
                echo "- Время приёма: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "- Статус: received_by_dispatcher"
                echo "- Важно: это только техническая квитанция GitHub Actions. Она НЕ доказывает, что агент прочитал или принял задачу."
                echo
                echo "## Исходное задание"
                echo
                cat "${TASK_PATH}"
              } > "${OUT_FILE}"
            done < <(git diff --name-only --diff-filter=A ${RANGE} -- "${INBOX}/*.md" || true)
          done

          if [ "${FOUND}" -eq 0 ]; then
            echo "No newly added inbox messages found."
            exit 0
          fi

          git config user.name "Universal-AI-Factory Dispatcher"
          git config user.email "factory@users.noreply.github.com"
          git add coordination/*/outbox/
          if ! git diff --cached --quiet; then
            git commit -m "chore(factory): record multi-agent inbox receipts [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
