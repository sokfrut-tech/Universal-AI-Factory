name: Universal Inbox Dispatcher

on:
  push:
    branches: [ main ]
    paths:
      - 'coordination/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-inbox-dispatcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register-inboxes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new inbox messages and create truthful receipts
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            mapfile -t CANDIDATES < <(find coordination -mindepth 3 -maxdepth 3 -type f -path 'coordination/*/inbox/*.md' -print | sort)
          else
            if [[ -z "${BEFORE}" || "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-list --max-count=2 "${SHA}" | tail -n 1)"
              RANGE="${BASE} ${SHA}"
            else
              RANGE="${BEFORE} ${SHA}"
            fi
            read -r BASE HEAD <<< "${RANGE}"
            mapfile -t CANDIDATES < <(git diff --name-only --diff-filter=AM "${BASE}" "${HEAD}" -- 'coordination/**' | awk '/^coordination\/[^/]+\/inbox\/[^/]+\.md$/')
          fi

          created=0
          for task_path in "${CANDIDATES[@]}"; do
            [[ -f "${task_path}" ]] || continue
            agent="$(cut -d/ -f2 <<< "${task_path}")"
            task_name="$(basename "${task_path}")"
            out_dir="coordination/${agent}/outbox"
            out_file="${out_dir}/FACTORY_RECEIPT_${task_name}"

            mkdir -p "${out_dir}"
            if [[ -e "${out_file}" ]]; then
              echo "Receipt already exists; leaving it untouched: ${out_file}"
              continue
            fi

            task_id="$(grep -m1 -E '^[[:space:]]*-[[:space:]]*(Task ID|Correlation ID):' "${task_path}" | sed -E 's/^[[:space:]]*-[[:space:]]*[^:]+:[[:space:]]*//' || true)"
            {
              echo "# Автоматическая квитанция о регистрации"
              echo
              echo "- Автор: Universal-AI-Factory Dispatcher"
              echo "- Кому: ${agent}"
              echo "- Время UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
              echo "- Исходное сообщение: \`${task_path}\`"
              echo "- Task ID: ${task_id:-не указан}"
              echo "- Статус: registered_by_ci (файл обнаружен и зарегистрирован; агентом не прочитан)"
              echo
              echo "> Это только техническая квитанция GitHub Actions. Она НЕ доказывает, что внешний агент прочитал сообщение, принял задачу или выполнил её."
            } > "${out_file}"
            echo "Created receipt: ${out_file}"
            created=$((created + 1))
          done

          if (( created == 0 )); then
            echo "No unacknowledged inbox messages found."
            exit 0
          fi

          git config user.name "Universal-AI-Factory Dispatcher"
          git config user.email "factory@users.noreply.github.com"
          git add coordination/*/outbox/FACTORY_RECEIPT_*.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(coordination): register new agent inbox messages [skip ci]"
            git push
          fi
