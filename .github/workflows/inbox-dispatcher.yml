name: Claude Inbox Dispatcher (disabled until real provider exists)

# This workflow intentionally does not dispatch tasks.
# The previous implementation only generated ACK receipts and pushed them
# back to main; it did not invoke Claude and must not imply execution.
# Real provider dispatch will be added separately with explicit credentials,
# least-privilege permissions, bounded inputs, and verifiable result artifacts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "::notice::Claude dispatch is disabled: no verified provider adapter is configured."
          echo "No task was read, no provider was called, and no repository was modified."
