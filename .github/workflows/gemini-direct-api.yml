name: Gemini Direct API Worker

on:
  push:
    branches:
      - main
    paths:
      - 'coordination/gemini/dispatch/*.md'

permissions:
  contents: write

concurrency:
  group: gemini-direct-api-worker
  cancel-in-progress: false

jobs:
  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_PAT || github.token }}

      - name: Find exactly one new task
        id: task
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BEFORE}" || "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
            BEFORE="${AFTER}~1"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=AM "${BEFORE}" "${AFTER}" -- 'coordination/gemini/dispatch/*.md')
          if [[ "${#files[@]}" != 1 ]]; then
            printf 'Expected one task, found %s\n' "${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          test -f "${files[0]}"
          echo "file=${files[0]}" >> "${GITHUB_OUTPUT}"
          echo "Gemini task: ${files[0]}"

      - name: Invoke Gemini Developer API
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TASK_FILE: ${{ steps.task.outputs.file }}
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY}" || { echo "::error::GEMINI_API_KEY secret is missing"; exit 1; }
          MODEL="${GEMINI_MODEL:-gemini-3.8-flash}"
          PROMPT_FILE=/tmp/gemini-prompt.txt
          {
            echo "You are Gemini, an independent senior engineering agent. Complete the task in detail. Separate verified facts from hypotheses. Never claim access, code changes, or tests that were not actually performed. Return a substantial Markdown report, not an ACK."
            echo
            echo "TASK FILE: ${TASK_FILE}"
            echo
            cat "${TASK_FILE}"
          } > "${PROMPT_FILE}"
          jq -n --rawfile prompt "${PROMPT_FILE}" '{contents:[{parts:[{text:$prompt}]}],generationConfig:{temperature:0.15,maxOutputTokens:12000}}' > /tmp/gemini-request.json
          curl --fail-with-body --silent --show-error --max-time 300 --retry 2 --retry-delay 4 --retry-all-errors             "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent"             -H "x-goog-api-key: ${GEMINI_API_KEY}"             -H "content-type: application/json"             --data-binary @/tmp/gemini-request.json             -o /tmp/gemini-response.json
          ANSWER="$(jq -r '[.candidates[0].content.parts[]?.text] | join("\n")' /tmp/gemini-response.json)"
          if [[ -z "${ANSWER//[[:space:]]/}" ]]; then
            jq '{error,promptFeedback,candidates:[.candidates[]? | {finishReason,safetyRatings}]}' /tmp/gemini-response.json
            exit 1
          fi
          REPORT="coordination/gemini/outbox/REPORT_$(basename "${TASK_FILE}")"
          mkdir -p coordination/gemini/outbox
          {
            echo "# Gemini engineering report"
            echo
            echo "- Task file: ${TASK_FILE}"
            echo "- Model: ${MODEL}"
            echo "- Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Source: direct Gemini Developer API"
            echo
            printf '%s\n' "${ANSWER}"
          } > "${REPORT}"
          echo "Report created: ${REPORT}"

      - name: Commit Gemini report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Universal AI Factory Gemini Agent"
          git config user.email "gemini-agent@users.noreply.github.com"
          git add coordination/gemini/outbox/
          git diff --cached --quiet && { echo "::error::No report generated"; exit 1; }
          git commit -m "chore(factory): save direct Gemini API report [skip ci]"
          git push origin HEAD:main
