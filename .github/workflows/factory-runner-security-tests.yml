name: Factory Runner Workflow Security Tests

on:
  pull_request:
    paths:
      - ".github/workflows/factory-runner.yml"
      - ".github/workflows/factory-runner-security-tests.yml"
      - "tests/test_factory_runner_workflow.py"
  push:
    branches:
      - "security/harden-factory-runner-workflow-2026-11-05"
    paths:
      - ".github/workflows/factory-runner.yml"
      - ".github/workflows/factory-runner-security-tests.yml"
      - "tests/test_factory_runner_workflow.py"

permissions:
  contents: read

jobs:
  workflow-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run workflow security assertions
        run: python3 -m unittest tests/test_factory_runner_workflow.py -v
