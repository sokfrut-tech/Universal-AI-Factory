name: Verify Whisper Jarvis (disabled pending safe audit implementation)

# The previous workflow claimed security verification while ignoring Gitleaks
# failures and pushed a report directly to main using a write token.
# Keep it inert until a read-only, evidence-based audit is implemented.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "::notice::Whisper audit workflow is disabled pending a safe read-only replacement."
          echo "No repository was checked out, no secrets were scanned, and no verification is claimed."
