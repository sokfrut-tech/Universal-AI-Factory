name: Temporary reference image export
on:
  push:
    branches:
      - tools/export-reference-image-2026-11-04
    paths:
      - .github/workflows/export-reference-image.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert reference to compact base64 text
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          import base64, io, pathlib
          src = pathlib.Path("shared-assets/reference-images/a1c26558cc356f59dcc775543ade83f1d306697dd1509f3fdeaf397333ee685e.png")
          im = Image.open(src).convert("RGB")
          im.thumbnail((1400, 1400))
          out = io.BytesIO()
          im.save(out, format="JPEG", quality=82, optimize=True)
          pathlib.Path("/tmp/reference-image.jpg.b64").write_text(base64.b64encode(out.getvalue()).decode("ascii"))
          print(f"Converted {im.size[0]}x{im.size[1]} to {len(out.getvalue())} bytes")
          PY
      - name: Publish temporary text bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          data = open("/tmp/reference-image.jpg.b64","rb").read()
          payload = json.dumps({
            "message":"chore: temporary reference image transfer bridge",
            "content":base64.b64encode(data).decode("ascii"),
            "branch":"tools/export-reference-image-2026-11-04"
          }).encode()
          req = urllib.request.Request(
            "https://api.github.com/repos/sokfrut-tech/Universal-AI-Factory/contents/shared-assets/reference-images/.transfer/reference-image.jpg.b64",
            data=payload, headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
              "Content-Type":"application/json"
            }, method="PUT")
          with urllib.request.urlopen(req) as r: print("Bridge published:", r.status)
          PY
