name: Real Gemini Agent Execution

on:
  push:
    branches: [main]
    paths:
      - 'coordination/gemini/dispatch/*.md'
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Exact Gemini dispatch task markdown path'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: real-gemini-agent-execution
  cancel-in-progress: false

jobs:
  execute-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_PAT || github.token }}

      - name: Resolve task
        id: task
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_TASK: ${{ inputs.task_file }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TASK="${INPUT_TASK}"
          else
            if [[ -z "${EVENT_BEFORE}" || "${EVENT_BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
              RANGE="${EVENT_SHA}~1 ${EVENT_SHA}"
            else
              RANGE="${EVENT_BEFORE} ${EVENT_SHA}"
            fi
            mapfile -t TASKS < <(git diff --name-only --diff-filter=AM ${RANGE} -- 'coordination/gemini/dispatch/*.md')
            if [[ "${#TASKS[@]}" -eq 0 ]]; then
              echo "::error::No new Gemini dispatch task found in this push."
              exit 1
            fi
            if [[ "${#TASKS[@]}" -gt 1 ]]; then
              echo "::error::One task per API run is required; found ${#TASKS[@]}."
              exit 1
            fi
            TASK="${TASKS[0]}"
          fi
          [[ "${TASK}" == coordination/gemini/dispatch/*.md && -f "${TASK}" ]] || { echo "::error::Invalid or missing task path: ${TASK}"; exit 1; }
          echo "path=${TASK}" >> "${GITHUB_OUTPUT}"
          echo "Resolved Gemini task: ${TASK}"

      - name: Call Gemini Developer API directly
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TASK_PATH: ${{ steps.task.outputs.path }}
        run: |
          set -euo pipefail
          [[ -n "${GEMINI_API_KEY}" ]] || { echo "::error::GEMINI_API_KEY secret is missing."; exit 1; }
          MODEL="${GEMINI_MODEL:-gemini-3.8-flash}"
          TASK_BODY="$(cat "${TASK_PATH}")"
          SYSTEM_PROMPT='You are Gemini, the independent senior engineering agent of Universal AI Factory. Perform the requested analysis rigorously. Separate verified facts from hypotheses. Never claim to inspect repositories, devices, logs, or run tests unless their contents or access are explicitly provided. Return a substantial Markdown engineering report with evidence, root-cause ranking, minimal safe fixes, risks, and verification steps. Do not return an ACK.'
          PROMPT="${SYSTEM_PROMPT}

TASK FILE: ${TASK_PATH}

${TASK_BODY}"
          jq -n --arg prompt "${PROMPT}" '{
            contents:[{role:"user",parts:[{text:$prompt}]}],
            generationConfig:{temperature:0.15,maxOutputTokens:12000}
          }' > /tmp/gemini-request.json
          curl --fail-with-body --silent --show-error --max-time 240 --retry 2 --retry-delay 4 --retry-all-errors \
            "https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent" \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            -H "content-type: application/json" \
            --data-binary @/tmp/gemini-request.json \
            -o /tmp/gemini-response.json
          ANSWER="$(jq -r '[.candidates[0].content.parts[]?.text] | join("\n")' /tmp/gemini-response.json)"
          if [[ -z "${ANSWER//[[:space:]]/}" ]]; then
            echo "::error::Gemini API returned no text. Response metadata:"
            jq '{error, promptFeedback, candidates:[.candidates[]? | {finishReason, safetyRatings}]}' /tmp/gemini-response.json
            exit 1
          fi
          REPORT="coordination/gemini/outbox/REPORT_$(basename "${TASK_PATH}")"
          mkdir -p coordination/gemini/outbox
          {
            echo "# Gemini engineering report"
            echo
            echo "- Task: `${TASK_PATH}`"
            echo "- Model: ${MODEL}"
            echo "- Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Execution: direct Gemini Developer API response"
            echo
            printf '%s\n' "${ANSWER}"
          } > "${REPORT}"
          echo "Created substantive Gemini report: ${REPORT}"

      - name: Commit report to factory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Universal AI Factory Gemini Agent"
          git config user.email "gemini-agent@users.noreply.github.com"
          git add coordination/gemini/outbox/
          if git diff --cached --quiet; then
            echo "::error::Gemini produced no report to commit."
            exit 1
          fi
          git commit -m "chore(factory): save direct Gemini API report [skip ci]"
          git push origin HEAD:main
