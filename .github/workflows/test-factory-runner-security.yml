name: Factory Runner Security Tests

on:
  pull_request:
    paths:
      - ".github/workflows/factory-runner.yml"
      - "scripts/test_factory_runner_security.py"
      - ".github/workflows/test-factory-runner-security.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/factory-runner.yml"
      - "scripts/test_factory_runner_security.py"
      - ".github/workflows/test-factory-runner-security.yml"

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run runner security regression checks
        run: python3 scripts/test_factory_runner_security.py
